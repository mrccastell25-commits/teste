<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync Lab</title>
<style>
:root {
  --bg:      #0c0c0e;
  --surface: #16161a;
  --panel:   #1e1e24;
  --border:  rgba(255,255,255,0.07);
  --accent:  #5b8cff;
  --green:   #3ecf6e;
  --warn:    #ffb347;
  --danger:  #ff5f5f;
  --text:    #e0e0ec;
  --muted:   #5a5a72;
  --r:       9px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 13px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* header */
header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.logo { width: 28px; height: 28px; background: var(--accent); border-radius: 7px;
        display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; }
header h1 { font-size: 0.92rem; font-weight: 600; }
header p  { font-size: 0.72rem; color: var(--muted); margin-left: 2px; }

/* layout */
.workspace {
  flex: 1;
  display: grid;
  grid-template-rows: 1fr auto auto;
  overflow: hidden;
}

/* vídeos */
.videos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 12px 12px 0;
  overflow: hidden;
}
.video-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.video-card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.badge { font-size: 0.65rem; font-weight: 700; padding: 2px 7px;
         border-radius: 20px; text-transform: uppercase; letter-spacing: .05em; }
.badge-hd  { background: rgba(91,140,255,.15); color: var(--accent); }
.badge-dub { background: rgba(62,207,110,.15); color: var(--green); }
.card-title { font-size: 0.78rem; font-weight: 600; }
.card-status { margin-left: auto; font-size: 0.7rem; color: var(--muted); }
.card-status.live { color: var(--green); }
.btn-fs {
  margin-left: 6px;
  background: rgba(255,255,255,.07); border: 1px solid var(--border);
  color: var(--text); border-radius: 5px; padding: 3px 8px;
  cursor: pointer; font-size: 0.7rem;
  display: flex; align-items: center; gap: 4px;
  transition: background .14s;
}
.btn-fs:hover { background: rgba(255,255,255,.13); }
.btn-fs:disabled { opacity: .3; cursor: not-allowed; }
.iframe-wrap {
  position: relative; flex: 1; background: #000; min-height: 0;
}
.iframe-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
.placeholder {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; color: var(--muted); font-size: 0.8rem;
}
.placeholder svg { opacity: .25; }

/* ── posição e drift ── */
.sync-panel {
  margin: 10px 12px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

/* barra de progresso dos dois vídeos */
.timeline-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.tl-label {
  font-size: 0.68rem; font-weight: 700;
  width: 32px; text-align: right; flex-shrink: 0;
}
.tl-label.hd  { color: var(--accent); }
.tl-label.dub { color: var(--green); }
.tl-track {
  flex: 1; height: 8px;
  background: var(--panel);
  border-radius: 4px;
  position: relative;
  overflow: hidden;
}
.tl-fill {
  position: absolute; left: 0; top: 0; height: 100%;
  border-radius: 4px;
  transition: width .25s linear;
}
.tl-fill.hd  { background: var(--accent); opacity: .7; }
.tl-fill.dub { background: var(--green);  opacity: .7; }
.tl-time {
  font-family: 'Courier New', monospace;
  font-size: 0.72rem; color: var(--muted);
  width: 38px; text-align: left; flex-shrink: 0;
}

/* drift meter */
.drift-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.drift-label { font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }
.drift-bar-wrap {
  flex: 1;
  height: 6px;
  background: var(--panel);
  border-radius: 3px;
  position: relative;
}
/* linha central */
.drift-bar-wrap::after {
  content: '';
  position: absolute;
  left: 50%; top: 0;
  width: 1px; height: 100%;
  background: rgba(255,255,255,.15);
}
.drift-fill {
  position: absolute;
  top: 0; height: 100%;
  border-radius: 3px;
  transition: left .25s, width .25s, background .25s;
}
.drift-val {
  font-family: 'Courier New', monospace;
  font-size: 0.8rem; font-weight: 700;
  width: 72px; text-align: center; flex-shrink: 0;
}
.drift-ok   { color: var(--green); }
.drift-warn { color: var(--warn); }
.drift-bad  { color: var(--danger); }
.drift-hint { font-size: 0.68rem; color: var(--muted); flex-shrink: 0; min-width: 140px; }

/* ── controles ── */
.controls {
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  margin-top: 10px;
}
.url-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px; align-items: end;
}
.url-field { display: flex; flex-direction: column; gap: 4px; }
.url-field label { font-size: 0.68rem; color: var(--muted); }
.url-field input {
  background: var(--panel); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px;
  padding: 7px 10px; font-size: 0.8rem; outline: none;
  transition: border-color .14s;
}
.url-field input:focus { border-color: var(--accent); }
.url-field input::placeholder { color: var(--muted); }
.transport-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.tbtn {
  display: flex; align-items: center; gap: 5px;
  padding: 7px 14px; border-radius: 6px;
  font-size: 0.8rem; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  transition: background .13s;
}
.tbtn:hover { background: rgba(255,255,255,.08); }
.tbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tbtn.primary:hover { background: #4a7be0; }
.tbtn.danger  { background: rgba(255,95,95,.1); border-color: rgba(255,95,95,.25); color: var(--danger); }
.tbtn.danger:hover { background: rgba(255,95,95,.18); }
.tbtn:disabled { opacity: .3; cursor: not-allowed; }
.sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

/* sync nudge */
.sync-strip { display: flex; align-items: center; gap: 8px; flex: 1; }
.sync-label { font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }
.nudge-group { display: flex; gap: 3px; }
.snudge {
  padding: 5px 8px; border-radius: 5px;
  font-size: 0.74rem; font-weight: 600;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  cursor: pointer; transition: background .12s;
  user-select: none;
}
.snudge:hover { background: rgba(255,255,255,.08); }
.snudge.neg { color: #ff9a6b; border-color: rgba(255,154,107,.2); }
.snudge.pos { color: #6bddff; border-color: rgba(107,221,255,.2); }
.sync-val {
  font-family: 'Courier New', monospace;
  font-size: 0.88rem; font-weight: 700; color: var(--accent);
  min-width: 68px; text-align: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 5px; padding: 4px 6px;
}
.btn-zero {
  font-size: 0.72rem; color: var(--muted);
  background: transparent; border: 1px solid var(--border);
  border-radius: 5px; padding: 5px 9px; cursor: pointer;
  transition: color .12s, border-color .12s;
}
.btn-zero:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
.auto-drift-toggle {
  font-size: 0.72rem; color: var(--muted);
  background: transparent; border: 1px solid var(--border);
  border-radius: 5px; padding: 5px 9px; cursor: pointer;
  transition: all .12s; margin-left: auto;
}
.auto-drift-toggle.on  { color: var(--green); border-color: rgba(62,207,110,.3); background: rgba(62,207,110,.07); }
.auto-drift-toggle.off { color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">S</div>
  <div>
    <h1>Sync Lab</h1>
    <p>Teste de dublagem dual com medidor de drift em tempo real</p>
  </div>
</header>

<div class="workspace">

  <!-- vídeos -->
  <div class="videos">
    <div class="video-card">
      <div class="video-card-header">
        <span class="badge badge-hd">HD</span>
        <span class="card-title">Vídeo com qualidade — imagem (mudo)</span>
        <span class="card-status" id="status-a">aguardando</span>
        <button class="btn-fs" id="btn-fs" onclick="goFullscreen()" disabled>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
          Tela cheia
        </button>
      </div>
      <div class="iframe-wrap" id="wrap-a">
        <div class="placeholder" id="ph-a">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="3" width="20" height="14" rx="2"/><path d="m8 21 4-4 4 4"/><path d="M12 17v4"/>
          </svg>
          <span>Cole a URL e carregue</span>
        </div>
        <div id="player-a"></div>
      </div>
    </div>

    <div class="video-card">
      <div class="video-card-header">
        <span class="badge badge-dub">DUB</span>
        <span class="card-title">Vídeo com dublagem — áudio ativo</span>
        <span class="card-status" id="status-b">aguardando</span>
      </div>
      <div class="iframe-wrap" id="wrap-b">
        <div class="placeholder" id="ph-b">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
          <span>Cole a URL e carregue</span>
        </div>
        <div id="player-b"></div>
      </div>
    </div>
  </div>

  <!-- painel de sync visual -->
  <div class="sync-panel">

    <!-- timelines -->
    <div class="timeline-row">
      <span class="tl-label hd">HD</span>
      <div class="tl-track"><div class="tl-fill hd" id="tl-a" style="width:0%"></div></div>
      <span class="tl-time" id="time-a">0:00</span>
    </div>
    <div class="timeline-row">
      <span class="tl-label dub">DUB</span>
      <div class="tl-track"><div class="tl-fill dub" id="tl-b" style="width:0%"></div></div>
      <span class="tl-time" id="time-b">0:00</span>
    </div>

    <!-- drift meter -->
    <div class="drift-row">
      <span class="drift-label">Drift:</span>
      <div class="drift-bar-wrap">
        <div class="drift-fill" id="drift-fill" style="left:50%;width:0%;background:var(--green)"></div>
      </div>
      <span class="drift-val drift-ok" id="drift-val">0 ms</span>
      <span class="drift-hint" id="drift-hint">Em sincronia ✓</span>
    </div>

  </div>

  <!-- controles -->
  <div class="controls">
    <div class="url-row">
      <div class="url-field">
        <label>Vídeo HD — ficará mudo (só imagem)</label>
        <input type="text" id="url-a" value="https://www.youtube.com/watch?v=aZboQufmcag" />
      </div>
      <div class="url-field">
        <label>Vídeo Dublado — com som</label>
        <input type="text" id="url-b" value="https://www.youtube.com/watch?v=IA9VMdo32jo" />
      </div>
      <button class="tbtn primary" onclick="loadVideos()" style="height:34px;margin-bottom:1px">Carregar</button>
    </div>

    <div class="transport-row">
      <button class="tbtn primary" id="btn-play"  onclick="playBoth()"  disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>Play
      </button>
      <button class="tbtn"         id="btn-pause" onclick="pauseBoth()" disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>Pause
      </button>
      <button class="tbtn danger"  id="btn-stop"  onclick="stopBoth()"  disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Parar
      </button>

      <div class="sep"></div>

      <!-- nudge -->
      <div class="sync-strip">
        <span class="sync-label">Sync DUB:</span>
        <div class="nudge-group">
          <button class="snudge neg" onclick="nudge(-2000)">−2s</button>
          <button class="snudge neg" onclick="nudge(-500)">−500</button>
          <button class="snudge neg" onclick="nudge(-100)">−100</button>
          <button class="snudge neg" onclick="nudge(-33)">−33</button>
        </div>
        <div class="sync-val" id="sync-val">0 ms</div>
        <div class="nudge-group">
          <button class="snudge pos" onclick="nudge(+33)">+33</button>
          <button class="snudge pos" onclick="nudge(+100)">+100</button>
          <button class="snudge pos" onclick="nudge(+500)">+500</button>
          <button class="snudge pos" onclick="nudge(+2000)">+2s</button>
        </div>
        <button class="btn-zero" onclick="resetSync()">Zerar</button>
        <button class="tbtn" id="btn-apply" onclick="applyDriftOnce()" disabled>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48 2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48 2.83-2.83"/></svg>
          Corrigir agora
        </button>
      </div>
    </div>
  </div>

</div>

<script>
// ── estado ────────────────────────────────────────────────────────
let playerA = null, playerB = null;
let readyA = false, readyB = false;
let syncMs  = 0;          // offset desejado: B deve estar syncMs/1000s à frente de A
// sync engine — ver speedSync() e applyDriftOnce()
let nudging = false;      // flag: usuário está ajustando — suspende auto-correção momentaneamente
let nudgeTimer = null;
let pollInterval = null;

// ── YouTube API ───────────────────────────────────────────────────
const ytTag = document.createElement('script');
ytTag.src   = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytTag);
function onYouTubeIframeAPIReady() {}

// ── helpers ───────────────────────────────────────────────────────
function extractId(url) {
  const m = url.trim().match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (url.trim().length === 11 ? url.trim() : null);
}
function fmt(s) {
  if (!s || isNaN(s) || s < 0) return '0:00';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}
function setStatus(slot, txt, live=false) {
  const el = document.getElementById(`status-${slot}`);
  el.textContent = txt;
  el.className   = 'card-status' + (live ? ' live' : '');
}
function setTransport(on) {
  ['btn-play','btn-pause','btn-stop'].forEach(id =>
    document.getElementById(id).disabled = !on);
}

// ── load ──────────────────────────────────────────────────────────
function loadVideos() {
  const idA = extractId(document.getElementById('url-a').value);
  const idB = extractId(document.getElementById('url-b').value);
  if (!idA || !idB) { alert('Verifique as duas URLs.'); return; }

  stopPolling();
  if (playerA) try { playerA.destroy(); } catch(e) {}
  if (playerB) try { playerB.destroy(); } catch(e) {}
  readyA = readyB = false;
  setTransport(false);
  document.getElementById('btn-fs').disabled = true;
  setStatus('a','carregando...');
  setStatus('b','carregando...');
  ['ph-a','ph-b'].forEach(id => document.getElementById(id).style.display = 'none');

  const origin = window.location.origin || 'http://localhost';

  playerA = new YT.Player('player-a', {
    videoId: idA,
    playerVars: { autoplay:0, controls:1, rel:0, enablejsapi:1, origin },
    events: {
      onReady: () => {
        playerA.mute();
        readyA = true;
        setStatus('a','pronto ✓', true);
        checkReady();
      },
      onError: e => setStatus('a', `erro ${e.data}`),
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) setStatus('a','▶ tocando (mudo)', true);
        if (e.data === YT.PlayerState.PAUSED)  setStatus('a','pausado');
      }
    }
  });

  playerB = new YT.Player('player-b', {
    videoId: idB,
    playerVars: { autoplay:0, controls:1, rel:0, enablejsapi:1, origin },
    events: {
      onReady: () => {
        playerB.unMute();
        playerB.setVolume(100);
        readyB = true;
        setStatus('b','pronto ✓', true);
        checkReady();
      },
      onError: e => setStatus('b', `erro ${e.data}`),
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) setStatus('b','▶ áudio ativo', true);
        if (e.data === YT.PlayerState.PAUSED)  setStatus('b','pausado');
      }
    }
  });
}

function checkReady() {
  if (!readyA || !readyB) return;
  setTransport(true);
  document.getElementById('btn-fs').disabled = false;
  document.getElementById('btn-apply').disabled = false;
}

// ── transport ─────────────────────────────────────────────────────
function playBoth() {
  if (!readyA || !readyB) return;
  const posA    = playerA.getCurrentTime();
  const targetB = Math.max(0, posA + syncMs / 1000);
  playerA.playVideo();
  playerB.seekTo(targetB, true);
  playerB.playVideo();
  startPolling();
}
function pauseBoth() {
  if (playerA) playerA.pauseVideo();
  if (playerB) { playerB.setPlaybackRate(1); playerB.pauseVideo(); }
}
function stopBoth() {
  stopPolling();
  if (playerA) { playerA.stopVideo(); playerA.seekTo(0, true); }
  if (playerB) { playerB.setPlaybackRate(1); playerB.stopVideo(); playerB.seekTo(0, true); }
  resetMeter();
}

// ── fullscreen ────────────────────────────────────────────────────
function goFullscreen() {
  const iframe = document.querySelector('#wrap-a iframe');
  if (!iframe) return;
  (iframe.requestFullscreen || iframe.webkitRequestFullscreen ||
   iframe.mozRequestFullScreen).call(iframe);
}

// ── nudge (ajuste manual) ─────────────────────────────────────────
// Suspende a auto-correção por 2s após cada nudge para não brigar com o ajuste do usuário
function nudge(ms) {
  syncMs = Math.max(-15000, Math.min(15000, syncMs + ms));
  updateSyncDisplay();

  nudging = true;
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(() => { nudging = false; }, 2000);

  // Aplica imediatamente: reposiciona B relativo à posição atual de A
  if (readyA && readyB) {
    const posA    = playerA.getCurrentTime();
    const targetB = Math.max(0, posA + syncMs / 1000);
    playerB.seekTo(targetB, true);
    // Se estava tocando, garante que B continue tocando após o seek
    if (playerA.getPlayerState() === YT.PlayerState.PLAYING) {
      playerB.playVideo();
    }
  }
}
function resetSync() {
  syncMs = 0;
  updateSyncDisplay();
  if (readyA && readyB) {
    playerB.seekTo(Math.max(0, playerA.getCurrentTime()), true);
    if (playerA.getPlayerState() === YT.PlayerState.PLAYING) playerB.playVideo();
  }
}
function updateSyncDisplay() {
  document.getElementById('sync-val').textContent =
    (syncMs === 0 ? '0' : (syncMs > 0 ? '+' : '') + syncMs) + ' ms';
}

// ── sync engine: speed-based + seek de emergência ────────────────
//
// Em vez de seekTo() (impreciso, causa saltos), ajustamos a velocidade de B:
//   • B adiantado → desacelera B abaixo de 1× até convergir
//   • B atrasado  → acelera B acima de 1× até convergir
//   • Drift < FINE_MS → velocidade volta a 1× (sincronizado)
//   • Drift > SEEK_THRESHOLD → seek de emergência (drift enorme, ex: ao carregar)
//
const FINE_MS           = 80;   // dentro disso: ok, volta a 1×
const SPEED_THRESHOLD_MS = 80;  // fora disso: ajusta velocidade
const SEEK_THRESHOLD_MS  = 2500;// drift enorme: usa seek para convergir rápido
const MAX_RATE_DELTA     = 0.08; // máximo desvio de velocidade (1 ± 0.08)

let lastSeekTime = 0; // evita seeks repetidos em sequência

function applyDriftOnce() {
  if (!readyA || !readyB) return;
  const posA    = playerA.getCurrentTime();
  const targetB = Math.max(0, posA + syncMs / 1000);
  playerB.seekTo(targetB, true);
  if (playerA.getPlayerState() === YT.PlayerState.PLAYING) playerB.playVideo();
  lastSeekTime = Date.now();
}

function speedSync(driftMs) {
  if (!readyA || !readyB) return;
  if (playerA.getPlayerState() !== YT.PlayerState.PLAYING) {
    playerB.setPlaybackRate(1);
    return;
  }

  const absMs = Math.abs(driftMs);

  // Drift enorme → seek pontual (só se não fizemos um seek há menos de 3s)
  if (absMs > SEEK_THRESHOLD_MS && Date.now() - lastSeekTime > 3000) {
    applyDriftOnce();
    return;
  }

  // Dentro da zona fina → normaliza velocidade
  if (absMs < FINE_MS) {
    playerB.setPlaybackRate(1);
    return;
  }

  // Zona de correção por velocidade:
  // mapeia drift (FINE_MS … SEEK_THRESHOLD_MS) → delta (0 … MAX_RATE_DELTA)
  const t     = Math.min(1, (absMs - FINE_MS) / (SEEK_THRESHOLD_MS - FINE_MS));
  const delta = t * MAX_RATE_DELTA;

  // driftMs > 0 → B adiantado → desacelera B
  // driftMs < 0 → B atrasado  → acelera B
  const rate = driftMs > 0 ? 1 - delta : 1 + delta;
  playerB.setPlaybackRate(Math.round(rate * 100) / 100);
}

// ── polling — mede posições e atualiza o medidor de drift ─────────
function startPolling() {
  stopPolling();
  pollInterval = setInterval(poll, 500); // 2× por segundo
}
function stopPolling() {
  clearInterval(pollInterval);
  pollInterval = null;
}

function poll() {
  if (!readyA || !readyB) return;

  const stateA = playerA.getPlayerState();
  const stateB = playerB.getPlayerState();
  const posA   = playerA.getCurrentTime();
  const posB   = playerB.getCurrentTime();

  // Atualiza timelines
  updateTimeline('a', posA);
  updateTimeline('b', posB);

  // Calcula drift real: diferença entre onde B está e onde deveria estar
  const expectedB = posA + syncMs / 1000;
  const driftSec  = posB - expectedB;   // positivo = B adiantado; negativo = B atrasado
  const driftMs   = Math.round(driftSec * 1000);

  updateDriftMeter(driftMs);

  // Speed-based sync: ajusta a velocidade de B para convergir suavemente
  if (!nudging) speedSync(driftMs);
}

// ── timeline bars ─────────────────────────────────────────────────
let durationA = 0, durationB = 0;
function updateTimeline(slot, pos) {
  const player   = slot === 'a' ? playerA : playerB;
  const duration = player.getDuration() || 0;
  const pct      = duration > 0 ? Math.min(100, (pos / duration) * 100) : 0;
  document.getElementById(`tl-${slot}`).style.width  = pct + '%';
  document.getElementById(`time-${slot}`).textContent = fmt(pos);
}

// ── drift meter ───────────────────────────────────────────────────
function updateDriftMeter(driftMs) {
  const fill     = document.getElementById('drift-fill');
  const valEl    = document.getElementById('drift-val');
  const hintEl   = document.getElementById('drift-hint');
  const absMs    = Math.abs(driftMs);

  // Escala: ±2000ms = 50% da barra (para cada lado)
  const maxMs  = 2000;
  const halfPct = Math.min(50, (absMs / maxMs) * 50);

  if (driftMs >= 0) {
    // B adiantado → barra cresce para a direita do centro
    fill.style.left       = '50%';
    fill.style.width      = halfPct + '%';
  } else {
    // B atrasado → barra cresce para a esquerda do centro
    fill.style.left       = (50 - halfPct) + '%';
    fill.style.width      = halfPct + '%';
  }

  let cls, hint;
  if (absMs < 100) {
    cls  = 'drift-ok';
    hint = 'Em sincronia ✓';
    fill.style.background = 'var(--green)';
  } else if (absMs < 500) {
    cls  = 'drift-warn';
    hint = driftMs > 0 ? 'DUB adiantado — use −' + absMs + 'ms' : 'DUB atrasado — use +' + absMs + 'ms';
    fill.style.background = 'var(--warn)';
  } else {
    cls  = 'drift-bad';
    hint = driftMs > 0 ? 'DUB muito adiantado' : 'DUB muito atrasado';
    fill.style.background = 'var(--danger)';
  }

  valEl.textContent = (driftMs > 0 ? '+' : '') + driftMs + ' ms';
  valEl.className   = 'drift-val ' + cls;

  // Mostra a velocidade atual de B ao lado da dica
  let rateStr = '';
  if (readyB) {
    try {
      const r = playerB.getPlaybackRate();
      if (r !== 1) rateStr = ` · B a ${r}×`;
    } catch(e) {}
  }
  hintEl.textContent = hint + rateStr;
}

function resetMeter() {
  document.getElementById('tl-a').style.width = '0%';
  document.getElementById('tl-b').style.width = '0%';
  document.getElementById('time-a').textContent = '0:00';
  document.getElementById('time-b').textContent = '0:00';
  updateDriftMeter(0);
}
</script>
</body>
