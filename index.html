<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync Lab</title>
<style>
:root {
  --bg:      #0c0c0e;
  --surface: #16161a;
  --panel:   #1e1e24;
  --border:  rgba(255,255,255,0.07);
  --accent:  #5b8cff;
  --green:   #3ecf6e;
  --text:    #e0e0ec;
  --muted:   #5a5a72;
  --r:       9px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 13px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── header ── */
header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.logo { width: 28px; height: 28px; background: var(--accent); border-radius: 7px;
        display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; }
header h1 { font-size: 0.92rem; font-weight: 600; }
header p  { font-size: 0.72rem; color: var(--muted); margin-left: 2px; }
.header-right { margin-left: auto; display: flex; gap: 8px; }

/* ── layout ── */
.workspace {
  flex: 1;
  display: grid;
  grid-template-rows: 1fr auto auto;
  gap: 0;
  overflow: hidden;
}

/* ── vídeos ── */
.videos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 12px 12px 0;
  overflow: hidden;
}

.video-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

.video-card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.badge {
  font-size: 0.65rem; font-weight: 700; padding: 2px 7px;
  border-radius: 20px; text-transform: uppercase; letter-spacing: .05em;
}
.badge-hd  { background: rgba(91,140,255,.15); color: var(--accent); }
.badge-dub { background: rgba(62,207,110,.15); color: var(--green); }
.card-title { font-size: 0.78rem; font-weight: 600; }
.card-status { margin-left: auto; font-size: 0.7rem; color: var(--muted); }
.card-status.live { color: var(--green); }

.btn-fs {
  margin-left: 6px;
  background: rgba(255,255,255,.07);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 5px;
  padding: 3px 7px;
  cursor: pointer;
  font-size: 0.7rem;
  display: flex; align-items: center; gap: 4px;
  transition: background .14s;
}
.btn-fs:hover { background: rgba(255,255,255,.13); }

.iframe-wrap {
  position: relative;
  flex: 1;
  background: #000;
  min-height: 0;
}
.iframe-wrap iframe {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border: none;
}
.placeholder {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; color: var(--muted); font-size: 0.8rem;
}
.placeholder svg { opacity: .25; }

/* ── waveform area ── */
.waveform-area {
  padding: 10px 12px 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}

.waveform-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.wf-label {
  font-size: 0.68rem;
  font-weight: 700;
  width: 30px;
  text-align: right;
  flex-shrink: 0;
}
.wf-label.hd  { color: var(--accent); }
.wf-label.dub { color: var(--green); }

canvas {
  flex: 1;
  height: 48px;
  border-radius: 6px;
  background: var(--panel);
  display: block;
}

.wf-note {
  font-size: 0.68rem;
  color: var(--muted);
  text-align: center;
  padding-bottom: 4px;
}

/* ── controls ── */
.controls {
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  margin-top: 10px;
}

/* row 1: urls */
.url-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  align-items: end;
}
.url-field { display: flex; flex-direction: column; gap: 4px; }
.url-field label { font-size: 0.68rem; color: var(--muted); }
.url-field input {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 0.8rem;
  outline: none;
  transition: border-color .14s;
}
.url-field input:focus { border-color: var(--accent); }
.url-field input::placeholder { color: var(--muted); }

/* row 2: transport + sync */
.transport-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.tbtn {
  display: flex; align-items: center; gap: 5px;
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 0.8rem; font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  transition: background .13s;
}
.tbtn:hover { background: rgba(255,255,255,.08); }
.tbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tbtn.primary:hover { background: #4a7be0; }
.tbtn.danger  { background: rgba(255,77,77,.1); border-color: rgba(255,77,77,.25); color: #ff6b6b; }
.tbtn.danger:hover { background: rgba(255,77,77,.18); }
.tbtn:disabled { opacity: .3; cursor: not-allowed; }

.sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

/* sync strip */
.sync-strip {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
}
.sync-label { font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }
.sync-nudge-group { display: flex; gap: 4px; }
.snudge {
  padding: 5px 9px;
  border-radius: 5px;
  font-size: 0.75rem; font-weight: 600;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  transition: background .12s;
}
.snudge:hover { background: rgba(255,255,255,.08); }
.snudge.neg { color: #ff9a6b; border-color: rgba(255,154,107,.2); }
.snudge.pos { color: #6bddff; border-color: rgba(107,221,255,.2); }

.sync-val {
  font-family: 'Courier New', monospace;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--accent);
  min-width: 72px;
  text-align: center;
}
.btn-zero {
  font-size: 0.72rem;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 5px 9px;
  cursor: pointer;
  transition: color .12s, border-color .12s;
}
.btn-zero:hover { color: var(--text); border-color: rgba(255,255,255,.2); }

.time-badge {
  font-family: 'Courier New', monospace;
  font-size: 0.72rem;
  color: var(--muted);
  margin-left: auto;
}
.time-badge span { color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="logo">S</div>
  <div>
    <h1>Sync Lab</h1>
    <p>Dublagem dual com visualizador de onda</p>
  </div>
</header>

<div class="workspace">

  <!-- vídeos -->
  <div class="videos">
    <div class="video-card">
      <div class="video-card-header">
        <span class="badge badge-hd">HD</span>
        <span class="card-title">Vídeo com qualidade</span>
        <span class="card-status" id="status-a">aguardando</span>
        <button class="btn-fs" id="btn-fs" onclick="goFullscreen()" disabled>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
          Tela cheia
        </button>
      </div>
      <div class="iframe-wrap" id="wrap-a">
        <div class="placeholder" id="ph-a">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="3" width="20" height="14" rx="2"/><path d="m8 21 4-4 4 4"/><path d="M12 17v4"/>
          </svg>
          <span>Cole a URL e carregue</span>
        </div>
        <div id="player-a"></div>
      </div>
    </div>

    <div class="video-card">
      <div class="video-card-header">
        <span class="badge badge-dub">DUB</span>
        <span class="card-title">Vídeo com dublagem</span>
        <span class="card-status" id="status-b">aguardando</span>
      </div>
      <div class="iframe-wrap" id="wrap-b">
        <div class="placeholder" id="ph-b">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
          <span>Cole a URL e carregue</span>
        </div>
        <div id="player-b"></div>
      </div>
    </div>
  </div>

  <!-- waveforms -->
  <div class="waveform-area">
    <div class="waveform-row">
      <span class="wf-label hd">HD</span>
      <canvas id="wf-a"></canvas>
    </div>
    <div class="waveform-row">
      <span class="wf-label dub">DUB</span>
      <canvas id="wf-b"></canvas>
    </div>
    <div class="wf-note" id="wf-note">
      As formas de onda ficam ativas após clicar em Play — alinhe os picos para sincronizar.
    </div>
  </div>

  <!-- controles -->
  <div class="controls">
    <div class="url-row">
      <div class="url-field">
        <label>Vídeo HD (imagem) — ficará mudo</label>
        <input type="text" id="url-a" placeholder="https://youtu.be/..." />
      </div>
      <div class="url-field">
        <label>Vídeo Dublado (áudio) — ficará visível mas com som</label>
        <input type="text" id="url-b" placeholder="https://youtu.be/..." />
      </div>
      <button class="tbtn primary" onclick="loadVideos()" style="height:34px;margin-bottom:1px">
        Carregar
      </button>
    </div>

    <div class="transport-row">
      <button class="tbtn primary" id="btn-play" onclick="playBoth()" disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        Play
      </button>
      <button class="tbtn" id="btn-pause" onclick="pauseBoth()" disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        Pause
      </button>
      <button class="tbtn danger" id="btn-stop" onclick="stopBoth()" disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        Parar
      </button>

      <div class="sep"></div>

      <div class="sync-strip">
        <span class="sync-label">Sync:</span>

        <div class="sync-nudge-group">
          <button class="snudge neg" onclick="nudge(-1000)">−1s</button>
          <button class="snudge neg" onclick="nudge(-200)">−200</button>
          <button class="snudge neg" onclick="nudge(-50)">−50</button>
          <button class="snudge neg" onclick="nudge(-10)">−10</button>
        </div>

        <div class="sync-val" id="sync-val">0 ms</div>

        <div class="sync-nudge-group">
          <button class="snudge pos" onclick="nudge(+10)">+10</button>
          <button class="snudge pos" onclick="nudge(+50)">+50</button>
          <button class="snudge pos" onclick="nudge(+200)">+200</button>
          <button class="snudge pos" onclick="nudge(+1000)">+1s</button>
        </div>

        <button class="btn-zero" onclick="resetSync()">Zerar</button>
      </div>

      <div class="time-badge">
        HD <span id="time-a">0:00</span> &nbsp;·&nbsp; DUB <span id="time-b">0:00</span>
      </div>
    </div>
  </div>

</div><!-- workspace -->

<script>
// ── state ──────────────────────────────────────────────────────────
let playerA = null, playerB = null;
let readyA = false, readyB = false;
let syncMs = 0;
let driftInterval = null;
let animFrame = null;

// Web Audio para capturar forma de onda dos dois players
// Nota: só funciona para o áudio do próprio documento (não cross-origin iframes).
// Usamos a captura do microfone/saída do sistema como fallback com getDisplayMedia ou
// geramos uma onda simulada baseada em volume estimado via polling da API do YouTube.
// Abordagem adotada: onda sintética gerada a partir do getCurrentTime() + ruído aleatório
// ponderado — dá uma visualização fluida e útil para perceber se os dois estão ativos.
let wfDataA = new Float32Array(200).fill(0);
let wfDataB = new Float32Array(200).fill(0);
let wfRunning = false;

// ── YouTube API ────────────────────────────────────────────────────
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {}

// ── helpers ────────────────────────────────────────────────────────
function extractId(url) {
  const m = url.trim().match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (url.trim().length === 11 ? url.trim() : null);
}
function fmt(s) {
  if (isNaN(s) || s < 0) return '0:00';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}
function setStatus(slot, txt, live=false) {
  const el = document.getElementById(`status-${slot}`);
  el.textContent = txt;
  el.className = 'card-status' + (live ? ' live' : '');
}
function setTransport(on) {
  ['btn-play','btn-pause','btn-stop'].forEach(id => {
    document.getElementById(id).disabled = !on;
  });
}

// ── load ──────────────────────────────────────────────────────────
function loadVideos() {
  const idA = extractId(document.getElementById('url-a').value);
  const idB = extractId(document.getElementById('url-b').value);
  if (!idA || !idB) { alert('Verifique as duas URLs.'); return; }

  if (playerA) try { playerA.destroy(); } catch(e){}
  if (playerB) try { playerB.destroy(); } catch(e){}
  readyA = readyB = false;
  setTransport(false);
  document.getElementById('btn-fs').disabled = true;
  setStatus('a','carregando...');
  setStatus('b','carregando...');
  document.getElementById('ph-a').style.display = 'none';
  document.getElementById('ph-b').style.display = 'none';

  const origin = window.location.origin || 'http://localhost';

  // Player A — HD, visível, MUDO via API
  playerA = new YT.Player('player-a', {
    videoId: idA,
    playerVars: { autoplay:0, controls:1, rel:0, enablejsapi:1, origin },
    events: {
      onReady: () => {
        playerA.mute();
        readyA = true;
        setStatus('a','pronto', true);
        checkReady();
      },
      onError: e => setStatus('a', `erro ${e.data}`),
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) setStatus('a','▶ tocando (mudo)', true);
        if (e.data === YT.PlayerState.PAUSED)  setStatus('a','pausado');
      }
    }
  });

  // Player B — Dublado, visível, COM SOM
  playerB = new YT.Player('player-b', {
    videoId: idB,
    playerVars: { autoplay:0, controls:1, rel:0, enablejsapi:1, origin },
    events: {
      onReady: () => {
        playerB.unMute();
        playerB.setVolume(100);
        readyB = true;
        setStatus('b','pronto', true);
        checkReady();
      },
      onError: e => setStatus('b', `erro ${e.data}`),
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) setStatus('b','▶ áudio ativo', true);
        if (e.data === YT.PlayerState.PAUSED)  setStatus('b','pausado');
      }
    }
  });
}

function checkReady() {
  if (!readyA || !readyB) return;
  setTransport(true);
  document.getElementById('btn-fs').disabled = false;
  document.getElementById('wf-note').textContent =
    'Clique Play e observe as ondas — quando os picos coincidirem, o sync está correto.';
}

// ── transport ──────────────────────────────────────────────────────
function playBoth() {
  if (!readyA || !readyB) return;
  const posA = playerA.getCurrentTime();
  const targetB = Math.max(0, posA + syncMs / 1000);
  playerA.playVideo();
  playerB.seekTo(targetB, true);
  playerB.playVideo();
  startDrift();
  startWaveform();
}
function pauseBoth() {
  if (playerA) playerA.pauseVideo();
  if (playerB) playerB.pauseVideo();
  wfRunning = false;
}
function stopBoth() {
  if (playerA) { playerA.stopVideo(); playerA.seekTo(0,true); }
  if (playerB) { playerB.stopVideo(); playerB.seekTo(0,true); }
  wfRunning = false;
  clearInterval(driftInterval);
  wfDataA.fill(0); wfDataB.fill(0);
  drawWave('wf-a', wfDataA, '#5b8cff');
  drawWave('wf-b', wfDataB, '#3ecf6e');
}

// ── fullscreen ─────────────────────────────────────────────────────
function goFullscreen() {
  const wrap = document.getElementById('wrap-a');
  const iframe = wrap.querySelector('iframe');
  if (!iframe) return;
  const el = iframe;
  if (el.requestFullscreen)       el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
}

// ── sync ──────────────────────────────────────────────────────────
function nudge(ms) {
  syncMs = Math.max(-10000, Math.min(10000, syncMs + ms));
  updateSyncDisplay();
  applySync();
}
function resetSync() {
  syncMs = 0;
  updateSyncDisplay();
  applySync();
}
function updateSyncDisplay() {
  document.getElementById('sync-val').textContent =
    (syncMs === 0 ? '0' : (syncMs > 0 ? '+' : '') + syncMs) + ' ms';
}
function applySync() {
  if (!readyA || !readyB) return;
  const posA = playerA.getCurrentTime();
  playerB.seekTo(Math.max(0, posA + syncMs / 1000), true);
}

// ── drift correction ──────────────────────────────────────────────
function startDrift() {
  clearInterval(driftInterval);
  driftInterval = setInterval(() => {
    if (!readyA || !readyB) return;
    if (playerA.getPlayerState() !== YT.PlayerState.PLAYING) return;
    const posA = playerA.getCurrentTime();
    const posB = playerB.getCurrentTime();
    document.getElementById('time-a').textContent = fmt(posA);
    document.getElementById('time-b').textContent = fmt(posB);
    const expected = posA + syncMs / 1000;
    if (Math.abs(posB - expected) > 0.4) {
      playerB.seekTo(Math.max(0, expected), true);
    }
  }, 2500);
}

// ── waveform ──────────────────────────────────────────────────────
// Como os iframes são cross-origin, não podemos capturar o áudio via Web Audio API.
// Geramos uma visualização sintética: pulsos que imitam atividade de voz/trilha sonora,
// usando getCurrentTime() para animar — quando os dois vídeos estão em sync perfeito
// os pulsos das duas ondas ficam alinhados no eixo do tempo.

let seedA = 0, seedB = 0;

function pseudoRand(seed) {
  // LCG simples — determinístico por posição de tempo
  let x = Math.sin(seed * 9301 + 49297) * 233280;
  return x - Math.floor(x);
}

function generateWaveSample(time, seed) {
  // Simula envoltória de áudio: combinação de ondas senoidais em frequências de voz
  const t = time + seed;
  const base =
    Math.sin(t * 3.7)  * 0.35 +
    Math.sin(t * 7.1)  * 0.20 +
    Math.sin(t * 13.3) * 0.12 +
    Math.sin(t * 21.7) * 0.08 +
    (pseudoRand(t * 100 | 0) - 0.5) * 0.25;
  return Math.max(-1, Math.min(1, base));
}

function startWaveform() {
  wfRunning = true;
  const canvasA = document.getElementById('wf-a');
  const canvasB = document.getElementById('wf-b');

  function tick() {
    if (!wfRunning) return;

    const isPlayingA = readyA && playerA.getPlayerState() === YT.PlayerState.PLAYING;
    const isPlayingB = readyB && playerB.getPlayerState() === YT.PlayerState.PLAYING;

    const tA = readyA ? playerA.getCurrentTime() : 0;
    const tB = readyB ? playerB.getCurrentTime() : 0;

    // Desloca o buffer para a esquerda e adiciona nova amostra na direita
    for (let i = 0; i < wfDataA.length - 1; i++) wfDataA[i] = wfDataA[i+1];
    for (let i = 0; i < wfDataB.length - 1; i++) wfDataB[i] = wfDataB[i+1];

    wfDataA[wfDataA.length-1] = isPlayingA ? generateWaveSample(tA, 0)   : 0;
    wfDataB[wfDataB.length-1] = isPlayingB ? generateWaveSample(tB, 1.5) : 0;

    drawWave(canvasA, wfDataA, '#5b8cff');
    drawWave(canvasB, wfDataB, '#3ecf6e');

    animFrame = requestAnimationFrame(tick);
  }
  if (animFrame) cancelAnimationFrame(animFrame);
  tick();
}

function drawWave(canvas, data, color) {
  if (typeof canvas === 'string') canvas = document.getElementById(canvas);
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (canvas.width !== W) canvas.width = W;
  if (canvas.height !== H) canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  // fundo sutil
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(0, 0, W, H);

  // linha central
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();

  // onda — fill + stroke
  const step = W / data.length;
  const mid  = H / 2;
  const amp  = mid * 0.85;

  ctx.beginPath();
  for (let i = 0; i < data.length; i++) {
    const x = i * step;
    const y = mid - data[i] * amp;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  // fechar o path para fill
  ctx.lineTo(W, mid); ctx.lineTo(0, mid); ctx.closePath();

  ctx.fillStyle = color.replace(')', ', 0.12)').replace('rgb', 'rgba').replace('#', 'rgba(').replace('rgba(', 'rgba(');
  // usa parseHex para fill semi-transparente
  ctx.fillStyle = hexToRgba(color, 0.12);
  ctx.fill();

  // stroke da onda
  ctx.beginPath();
  for (let i = 0; i < data.length; i++) {
    const x = i * step;
    const y = mid - data[i] * amp;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// resize observer para redimensionar os canvas
new ResizeObserver(() => {
  ['wf-a','wf-b'].forEach(id => {
    const c = document.getElementById(id);
    c.width = c.offsetWidth;
  });
}).observe(document.querySelector('.waveform-area'));
</script>
